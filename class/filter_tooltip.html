<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Animation</title>

    <style>
        img {
            width: 600px;
            animation: colorChange 1s infinite;}
        @keyframes colorChange {
            0% {
                filter: grayscale(0%);}
            50% {
                filter: grayscale(100%);}
            100% {
                filter: grayscale(0%);}}
    </style>
</head>

<body>
    <img src="4d3358b36f07341c597a7f726ba71f6c.jpg" alt="Car">
</body>
</html>
