<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

</body>
<script>

//if else

    if(true){
        console.log('hello world');
    }
    if(false){
        console.log('hello world');
    }else{
        console.log('error');
    }

//if else if else

    var num= parseInt(prompt("Enter your marks:-"));
    if (num>=80){
        console.log('Grade A');
    }else if(num>=70){
        console.log('Grade B');
    }else{
        console.log('Grade C');
    }

//switch statement

    var str='true';

    switch(str){
        case 'monday':
            console.log('Monday');
            break;
        case 'tuesday':
            console.log('Tuesday');
            break;
        case 'wednesday':
            console.log('Wednesday');
            break;
        case 'thursday':
            console.log('Thursday');
            break;
        case 'friday':
            console.log('Friday');
            break;
        case 'saturday':
            console.log('Saturday');
            break;
        case 'sunday':
            console.log('Sunday');
            break;
        default:
            console.log('error');
    }

//ternary operator    

    var ter=(5==5)? 10:50;
    console.log(ter);
    console.log((5==5)? 10:50);
    (5==5)? console.log(10):console.log(50);

//for loop

    for(var i=0;i<5;i++){
        console.log("for loop:-"+i);
    }

//while loop

    let n=206
    while(n>0){
        console.log("while loop:-"+n%10);
        n=Math.floor(n/10);
    }

//do while loop

    let n2=3
    do{
        console.log("do while loop:-"+n2);
        n2 *=3
    }while(n2<=9);

//nested loop

    for(let i=0;i<5;i++){
        for(let j=0;j<3;j++){
            console.log("nested loop:-"+i*j);
        }
    }
</script>
</html>
