<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Registration</h1>
    
    <from>
        <fieldset>
            <legend>personal Information</legend>

            <label for="fullName"> Full Name :</label>
            <input type="text" id="fullName" name="'fullName" required placeholder="Enter your Name">
            <br />
            <br />
            <label for="email"> Email :</label>
            <input type="email" id="email" name="email" required placeholder="example@gmail.com">
            <br />
            <br />
            <label for="password"> password :</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password">
            <br />
            <br />
            <label for="Phone num"> Phone num :</label>
            <input type="tel" id="Phone num" name="Phone num" required placeholder="9999999999">
            <br />
            <br />
            <label for="dob"> Date Of Birth :</label>
            <input type="date" id="dob" name="dob" required />
            <br />
            <br />
            <label for="time"> Preffered Time :</label>
            <input type="time" id="time" name="time" required />
            <br />
            <br />
            <p>Gender</p>
            <input type="radio" name="gender" id="male" required />
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female" required />
            <label for="female">Female</label>
            <input type="radio" name="gender" id="other" required />
            <label for="other">other</label>
            
        </fieldset>
        <fieldset>
            <legend> Acadmic Information</legend>

            <label for="course">Select Course</label>
            <select id="course" name="course" id="">
            <option value="bba"></option>
            <option value="b-tech"></option>
            <option value="mca"></option>
            </select>
            <br />
            <br />
            <label for="prog"> Known Programming Language</label>
            <select name="" id=""></select>
        </fieldset>
    </from>
</body>
</html>
