<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        main {
            width: 350px;
            height: 700px;
            margin-top: 30px;
            box-shadow: 0 0 15px 5px rgba(255, 0, 0, 0.4);
        }

        article {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        article h1 {
            font-size: 50px;
            color: brown;
            margin-bottom: 0px;
        }

        article p {
            font-size: 20px;
            color: red;
        }

        section {
            width: 100%;
            height: 100%;
            display: flex;
        }

        section div {
            flex: 1;
            height: 100%;
            background: linear-gradient(brown, red, brown);
            border: 2px solid black;
            display: flex;
            align-items: center;
            padding: 10px;
        }

        section div a {
            display: inline-block;
            border-radius: 50%;
            border: 2px solid black;
            height: 20px;
            width: 20px;
            background-color: goldenrod;
        }
    </style>
</head>
<body>
    <main>
        <article>
        </article>
        <section>
            <div><a href="#"></a></div>
            <div><a href="#"></a></div>
        </section>
    </main>
</body>
</html>
